# Dtico Dairy — one domain serves the PWA and the API.
#   /            → frontend/dist (static PWA)
#   /api, /up    → Laravel (PHP-FPM)
#   /storage     → uploaded logos
# Replace dairy.example.com and paths, then: certbot --nginx -d dairy.example.com

server {
    listen 80;
    server_name dairy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dairy.example.com;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    root /var/www/dtico/frontend/dist;
    index index.html;

    client_max_body_size 5m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → Laravel front controller
    location ~ ^/(api|up)(/|$) {
        root /var/www/dtico/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/dtico/backend/public;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;   # large PDF / Excel exports
    }

    # Uploaded logos
    location /storage/ {
        alias /var/www/dtico/backend/storage/app/public/;
        expires 7d;
        access_log off;
    }

    # Hashed build assets never change → cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker and manifest must always be revalidated so updates reach phones.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA: every other path loads the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
